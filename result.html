<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Interview Analytics</title>

<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="image/logo.png">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


</head>

<body>

<header class="navbar">


<div class="logo">
    AI<span>Interview</span>
</div>

<button onclick="location.href='index.html'"
        class="secondary-btn">
    🏠 Home
</button>


</header>

<main class="analytics-container">


<div class="analytics-header">

    <div>
        <h1>Performance Analytics 📊</h1>
        <p>Analyze your interview performance</p>
    </div>

</div>


<!-- SCORE CARDS -->

<section class="analytics-cards">

    <div class="analytics-card">
        <span>🏆</span>
        <h3>Score</h3>
        <strong id="score">0%</strong>
    </div>

    <div class="analytics-card">
        <span>✅</span>
        <h3>Correct</h3>
        <strong id="correct">0</strong>
    </div>

    <div class="analytics-card">
        <span>❌</span>
        <h3>Wrong</h3>
        <strong id="wrong">0</strong>
    </div>

    <div class="analytics-card">
        <span>🎯</span>
        <h3>Accuracy</h3>
        <strong id="accuracy">0%</strong>
    </div>

</section>


<!-- CHART -->

<section class="chart-card">

    <h2>Performance Overview</h2>

    <canvas id="performanceChart"></canvas>

</section>


<!-- PERFORMANCE -->

<section class="performance-card">

    <h2>Performance Level</h2>

    <div id="performanceBadge"
         class="performance-badge">
        Loading...
    </div>

    <p id="performanceText"></p>

</section>


<!-- HISTORY -->

<section class="history-section">

    <div class="history-header">

        <h2>Interview History 📋</h2>

        <button id="clearHistory"
                class="delete-btn">
            Clear History
        </button>

    </div>


    <div class="table-container">

        <table>

            <thead>

                <tr>
                    <th>Date</th>
                    <th>Role</th>
                    <th>Score</th>
                    <th>Correct</th>
                    <th>Wrong</th>
                    <th>Accuracy</th>
                </tr>

            </thead>

            <tbody id="historyTable">

            </tbody>

        </table>

    </div>

</section>


<div class="result-buttons">

    <button onclick="location.href='page.html'" class="primary-btn"> Start New Interview → </button>
    <button onclick="location.href='jobs.html'" class="primary-btn">💼 Find Jobs Based on My Score</button>

</div>


</main>

<script src="js/result.js"></script>

</body>

</html>
