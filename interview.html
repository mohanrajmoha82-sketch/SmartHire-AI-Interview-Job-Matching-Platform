<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Interview</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="image/logo.png">

</head>

<body>

<header class="navbar">

    <div class="logo">
        AI<span>Interview</span>
    </div>

    <div class="timer">
        ⏱ <span id="timer">60</span>s
    </div>

</header>


<main class="interview-container">

    <div class="question-header">

        <span id="questionNumber">
            Question 1
        </span>

        <span id="progressText">
            1 / 10
        </span>

    </div>


    <div class="progress-container">

        <div id="progressBar"
             class="progress-bar">
        </div>

    </div>


    <section class="question-card">

        <h2 id="question">
            Loading question...
        </h2>

        <div id="options"
             class="options">
        </div>

    </section>


    <div class="navigation">

        <button id="prevBtn"
                class="secondary-btn">
            ← Previous
        </button>

        <button id="nextBtn"
                class="primary-btn">
            Next →
        </button>

    </div>

</main>


<script src="js/questions.js"></script>
<script src="js/interview.js"></script>

</body>
</html>
